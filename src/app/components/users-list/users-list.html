<div class="page-header">
  <h1>Usuarios</h1>
  <a class="button" routerLink="/users/new">Nuevo usuario</a>
</div>

<div class="toolbar">
  <input
    class="search"
    type="search"
    placeholder="Buscar por nombre"
    aria-label="Buscar usuarios"
    [(ngModel)]="search"
    (ngModelChange)="loadPage(1)"
  />
</div>

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando...</p>
} @else if (!error() || users().length > 0) {
  <table>
    <thead>
      <tr>
        <th>
          <button type="button" class="link" (click)="toggleOrder()">
            Nombre {{ order() === 'asc' ? '▲' : '▼' }}
          </button>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user._id) {
        <tr>
          <td>{{ user.name }}</td>
          <td class="actions">
            <button type="button" class="secondary" [routerLink]="['/users', user._id, 'edit']">
              Editar
            </button>
            <button type="button" class="danger" (click)="askDelete(user)">Borrar</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="empty" colspan="2">
            @if (search()) {
              No hay resultados para "{{ search() }}"
            } @else {
              No hay usuarios
            }
          </td>
        </tr>
      }
    </tbody>
  </table>

  <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="loadPage($event)" />

  <app-delete-modal
    [open]="!!userToDelete()"
    [itemName]="userToDelete()?.name ?? ''"
    [hardNote]="hardNote"
    [busy]="deleting()"
    (softDelete)="softDelete()"
    (hardDelete)="hardDelete()"
    (cancelled)="cancelDelete()"
  />
}
